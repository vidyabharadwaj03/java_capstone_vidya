# Local Development Configuration

# Database Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for viewing database in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration - Development
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

jwt-secret=${JWT_SECRET:dev-only-secret-U6v2kzA7Xp9Rq3tYu1wB5s8Df0Gh4Jj7Kl2Pn5Ms9Qv2Rt4Sv6Xy8Zz1Cc3Vb5N}
jwt-expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging Configuration - Verbose for development
logging.level.assembly.general.api=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
